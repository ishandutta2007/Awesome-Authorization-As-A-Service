<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.4" />
    </linearGradient>

    <!-- Dynamic CSS Animations -->
    <style>
      .bg-grid {
        stroke: #334155;
        stroke-dasharray: 4,4;
        opacity: 0.25;
      }
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      .pulse-node-delayed {
        animation: pulse 3s infinite ease-in-out;
        animation-delay: 1.5s;
      }
      .flow-line {
        stroke-dasharray: 10, 15;
        animation: flow 20s linear infinite;
      }
      .glow-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        filter: drop-shadow(0 4px 12px rgba(99, 102, 241, 0.4));
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .badge-tag {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #c084fc;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 10px #a855f7); }
      }

      @keyframes flow {
        0% { stroke-dashoffset: 250; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Tech Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Animated Auth Mesh (Background Network) -->
  <g opacity="0.4">
    <!-- Connecting Lines -->
    <path d="M 150,100 L 350,70 L 550,120 L 750,60 L 950,110 L 1080,80" stroke="url(#primaryGlow)" stroke-width="2" fill="none" class="flow-line" />
    <path d="M 100,300 L 300,330 L 600,290 L 850,340 L 1100,310" stroke="#38bdf8" stroke-width="1.5" fill="none" class="flow-line" />
    <path d="M 350,70 L 300,330 M 550,120 L 600,290 M 750,60 L 850,340" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,6" opacity="0.5" />

    <!-- Pulsing Nodes -->
    <circle cx="150" cy="100" r="6" fill="#818cf8" class="pulse-node" />
    <circle cx="350" cy="70" r="8" fill="#c084fc" class="pulse-node-delayed" />
    <circle cx="550" cy="120" r="7" fill="#f472b6" class="pulse-node" />
    <circle cx="750" cy="60" r="9" fill="#38bdf8" class="pulse-node-delayed" />
    <circle cx="950" cy="110" r="6" fill="#a855f7" class="pulse-node" />
    <circle cx="300" cy="330" r="7" fill="#38bdf8" class="pulse-node" />
    <circle cx="600" cy="290" r="8" fill="#818cf8" class="pulse-node-delayed" />
    <circle cx="850" cy="340" r="6" fill="#c084fc" class="pulse-node" />
  </g>

  <!-- Central Shield & Key Symbol (Decorative Foreground Element) -->
  <g transform="translate(100, 140)">
    <!-- Shield Outline -->
    <path d="M 40,0 L 80,20 V 60 C 80,95 40,120 40,120 C 40,120 0,95 0,60 V 20 Z" fill="url(#shieldGrad)" stroke="#a855f7" stroke-width="3" />
    <!-- Lock Icon inside Shield -->
    <rect x="26" y="52" width="28" height="24" rx="4" fill="#ffffff" />
    <path d="M 32,52 V 42 C 32,36 36,32 40,32 C 44,32 48,36 48,42 V 52" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="40" cy="62" r="3" fill="#6366f1" />
  </g>

  <!-- Foreground Title and Subtitle -->
  <!-- Category Pill -->
  <g transform="translate(210, 115)">
    <rect width="320" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="160" y="19" text-anchor="middle" class="badge-tag">🔒 FINE-GRAINED AUTHORIZATION ENGINE</text>
  </g>

  <!-- Main Title -->
  <text x="210" y="190" font-size="44" class="glow-text">Awesome Authorization-as-a-Service</text>

  <!-- Subtitle -->
  <text x="210" y="235" font-size="20" class="subtitle-text">Curated List of SaaS Platforms &amp; Open-Source Fine-Grained AuthZ Engines</text>
  <text x="210" y="265" font-size="16" fill="#64748b" font-family="system-ui, -apple-system, sans-serif">
    ReBAC / Zanzibar • Policy Decision Points (PDP) • ABAC • RBAC • Policy-as-Code
  </text>

  <!-- Tag Pills -->
  <g transform="translate(210, 300)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="65" y="20" font-size="13" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">⚡ OpenFGA &amp; SpiceDB</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="205" y="20" font-size="13" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">🛡️ OPA &amp; Cerbos</text>

    <!-- Pill 3 -->
    <rect x="280" y="0" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="340" y="20" font-size="13" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">🔑 Oso &amp; Casbin</text>

    <!-- Pill 4 -->
    <rect x="415" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="485" y="20" font-size="13" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">🌐 Permit.io &amp; WorkOS</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#primaryGlow)" rx="3" />
</svg>
